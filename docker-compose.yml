name: job-informer-desktop

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/}
        VITE_API_TOKEN: ${VITE_API_TOKEN:-}
    env_file:
      - .env
    environment:
      API_TOKEN: ${API_TOKEN:-}
      APP_INSTANCE_NAME: ${APP_INSTANCE_NAME:-job-informer-desktop}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
      JOBS_DB_PATH: /app/data/jobs.db
      COLLECTION_STALE_AFTER_DAYS: ${COLLECTION_STALE_AFTER_DAYS:-7}
    volumes:
      - ./backend/data:/app/data
      - job-logs:/app/backend/logs
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=1).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  job-logs:
