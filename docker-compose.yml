services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/}
        VITE_API_TOKEN: ${VITE_API_TOKEN:-}
    user: "0"
    env_file:
      - .env
    environment:
      API_TOKEN: ${API_TOKEN:-}
      JOBS_DB_PATH: /app/data/jobs.db
    volumes:
      - ./backend/data:/app/data
      - job-logs:/app/logs
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  job-logs:
